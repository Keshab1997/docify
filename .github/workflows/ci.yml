name: Flutter CI

# Validates every branch and pull request. No Android artifacts on push.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.8.5
    with:
      flutter-channel: stable
      working-directory: "."
      run-format-check: true
      run-analyze: true
      run-tests: true
      code-coverage: true
      build-apk: false
      build-aab: false

name: Publish Android Release

# Manual only: builds a signed APK/AAB, creates a version tag and GitHub Release.
# The reusable publish wrapper enforces version and placeholder safety checks.
#
# This is the workflow that hands the app to real users, so it refuses to run
# until the real AdMob ids exist as repository variables
# (Settings -> Secrets and variables -> Actions -> Variables):
#   ADMOB_APP_ID     ca-app-pub-<publisher>~<app>
#   ADMOB_BANNER_ID  ca-app-pub-<publisher>/<unit>
# Shipping Google's sample ids earns nothing and is not a valid release.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft?
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark this as a prerelease?
        required: false
        type: boolean
        default: false
      upload_to_play_internal:
        description: Also upload the signed AAB to Google Play Internal testing?
        required: false
        type: boolean
        default: false
      package_name:
        description: Android applicationId / Play Console package name (required if Play upload is enabled)
        required: false
        type: string
        default: com.keshabstudios.docify

permissions:
  contents: write

jobs:
  # The builder cannot create distribution/whatsnew for us - it only receives
  # the path and hands it to the upload action - so the notes have to be in the
  # repository before the run. This gate fails the release when they are missing,
  # stale, untranslated, or over Play's 500 character limit, which turns "I
  # forgot the notes" from a rejected upload into a red check here.
  whatsnew-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/whatsnew.dart --check

  ads-config:
    runs-on: ubuntu-latest
    steps:
      - name: Real AdMob ids are required before publishing
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: |
          missing=0
          if [ -z "$ADMOB_APP_ID" ]; then
            echo "::error::Repository variable ADMOB_APP_ID is not set."
            missing=1
          fi
          if [ -z "$ADMOB_BANNER_ID" ]; then
            echo "::error::Repository variable ADMOB_BANNER_ID is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set both under Settings -> Secrets and variables -> Actions -> Variables, then re-run this workflow."
            exit 1
          fi
          echo "AdMob ids present: publishing with real ad units."

  # Google Sign-In must work in the artifact real users install, so this is a
  # hard gate: a present-but-unusable google-services.json (no Web OAuth
  # client) fails here instead of shipping a dead Sign-In button to Play.
  firebase-config:
    uses: ./.github/workflows/firebase-config-check.yml
    with:
      package-name: ${{ inputs.package_name }}
      require-firebase: true
    secrets:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}

  publish:
    needs: [ads-config, whatsnew-check, firebase-config]
    uses: Keshab1997/flutter-builder/.github/workflows/publish-release.yml@v1.11.1
    with:
      working-directory: "."
      app-name: "Docify: Photo , PDF & CV Maker"
      release-draft: ${{ inputs.draft }}
      release-prerelease: ${{ inputs.prerelease }}
      fail-on-placeholders: true
      verify-signing: true
      # Play upload is opt-in. Ticking upload_to_play_internal in the Actions
      # UI sends the same signed AAB to Play Internal in this same run; leaving
      # it unticked means no Play upload at all. The notes below are what Play
      # shows on the store listing, so rewrite them before every release.
      play-track: ${{ inputs.upload_to_play_internal && 'internal' || '' }}
      play-package-name: ${{ inputs.package_name }}
      play-whats-new-directory: ${{ inputs.upload_to_play_internal && 'distribution/whatsnew' || '' }}
      play-status: completed
      dart-defines: |
        ADMOB_BANNER_ID=${{ vars.ADMOB_BANNER_ID }}
        GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      build-env: |
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
    secrets: inherit

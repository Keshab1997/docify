name: Web Preview

# Builds the app for the web on every push and pull request and publishes it
# to GitHub Pages under preview/<branch>: test the app by opening a URL in a
# browser instead of installing an APK. One-time setup: Settings -> Pages ->
# Build and deployment -> Deploy from a branch -> gh-pages (root); the first
# run creates the branch. Needs the web platform (flutter create --platforms
# web .); plugins without web support will not work in the preview.
#
# Deleting a branch removes its preview again: the cleanup job below runs on the
# `delete` event, so gh-pages does not keep a web bundle for every dead branch.
# GitHub runs delete-triggered workflows from the default branch, so merge this
# file before relying on that.
#
# The preview job also keeps Settings -> About -> Website on preview/main while
# it is at it (v1.8.6).
# The push trigger is main-only: a branch with an open pull request already
# builds through the pull_request event, and both together fired two deploys
# for one push against the shared gh-pages branch.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "distribution/**"
  pull_request:
  delete:

permissions:
  contents: write
  pull-requests: write

# All previews of one repository share a single lane, because they share one
# gh-pages branch. Every writer runs alone: the deploy action pushes with a
# compare-and-swap and refuses a push when another run moved the branch in the
# meantime ("cannot lock ref ... is expected"), and updating a branch that has an
# open pull request fires a push run and a pull_request run at the same time.
# Queueing also keeps a deleted branch's cleanup from cancelling, or being
# cancelled by, the deploy of the default branch.
concurrency:
  group: web-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name != 'delete'
    uses: Keshab1997/flutter-builder/.github/workflows/web-preview.yml@v1.12.1
    with:
      working-directory: "."
      comment-on-pr: true
      # Settings -> About -> Website stays on this preview. Needs an admin
      # credential, which GITHUB_TOKEN is not: the APP_PRIVATE_KEY secret plus
      # the APP_ID variable (this repo has both).
      set-about-link: true
      app-id: ${{ vars.APP_ID }}
    secrets: inherit

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    uses: Keshab1997/flutter-builder/.github/workflows/preview-cleanup.yml@v1.12.1
    # A delete event leaves the event payload unreadable inside a called
    # workflow, so the caller hands the deleted ref over itself.
    with:
      branch-name: ${{ github.event.ref }}
    permissions:
      contents: write

name: Web Preview

# Builds the app for the web on every push and pull request and publishes it
# to GitHub Pages under preview/<branch>: test the app by opening a URL in a
# browser instead of installing an APK. One-time setup: Settings -> Pages ->
# Build and deployment -> Deploy from a branch -> gh-pages (root); the first
# run creates the branch. Needs the web platform (flutter create --platforms
# web .); plugins without web support will not work in the preview.
#
# Deleting a branch removes its preview again: the cleanup job below runs on the
# `delete` event, so gh-pages does not keep a web bundle for every dead branch.
# GitHub runs delete-triggered workflows from the default branch, so merge this
# file before relying on that.
on:
  push:
  pull_request:
  delete:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'delete'
    uses: Keshab1997/flutter-builder/.github/workflows/web-preview.yml@v1.8.2
    with:
      working-directory: "."
      comment-on-pr: true
    secrets: inherit

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    uses: Keshab1997/flutter-builder/.github/workflows/preview-cleanup.yml@v1.8.2
    permissions:
      contents: write

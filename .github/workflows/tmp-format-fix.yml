name: Format fix (temporary)
on:
  push:
    branches: [fix/format-profile-screen]
    paths: ['.github/workflows/tmp-format-fix.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      # Same steps as ci.yml: resolve packages, then format what CI checks.
      - run: flutter pub get
      - run: dart format .
      - run: git --no-pager diff --stat
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test
          git diff --cached --quiet || git commit -m "style: apply Dart formatting"
          git push

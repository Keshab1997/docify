name: Manual Android Build

# Actions -> Manual Android Build -> Run workflow. AAB requires signing secrets.
# AdMob ids come from repository variables (Settings -> Secrets and variables ->
# Actions -> Variables): ADMOB_APP_ID and ADMOB_BANNER_ID. Without them the app
# simply shows no ads instead of a Google test ad.
on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  # Catches the failure mode that produces a green build and a dead Sign-In
  # button: google-services.json present and valid, but with no Web OAuth
  # client, so the APK gets no default_web_client_id. Runs in seconds, before
  # Gradle starts. See .github/workflows/firebase-config-check.yml.
  firebase-config:
    uses: ./.github/workflows/firebase-config-check.yml
    with:
      package-name: com.keshabstudios.docify
      # A manually triggered build may legitimately be guest-only, so an
      # absent secret warns instead of failing. A secret that IS set but
      # cannot possibly work always fails.
      require-firebase: false
    secrets:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}

  build:
    needs: firebase-config
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.11.1
    with:
      flutter-channel: stable
      working-directory: "."
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      artifact-retention-days: 14
      # Fail the build if a Google test ad unit id, a com.example id or a
      # debug-signed release slips in, and verify the artifact signature.
      fail-on-placeholders: true
      verify-signing: true
      dart-defines: |
        ADMOB_BANNER_ID=${{ vars.ADMOB_BANNER_ID }}
        GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      build-env: |
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

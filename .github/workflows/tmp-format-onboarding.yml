name: Format onboarding (temporary)
on:
  push:
    branches: [feat/onboarding-clay-redesign]
    paths: ['.github/workflows/tmp-format-onboarding.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      # Same steps as ci.yml: resolve packages first so the formatter sees the
      # project's language version, then format exactly what CI checks.
      - run: flutter pub get
      - run: dart format .
      - name: Show what changed
        run: git --no-pager diff --stat
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib
          git diff --cached --quiet || git commit -m "style(onboarding): apply Dart formatting"
          git push

name: jobdoc
description: "JobDoc - Photo, PDF & CV. Resize photo, signature, PDF and CV for job and exam forms."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  signature: ^5.5.0
  crop_your_image: ^1.0.2
  google_mobile_ads: ^5.1.0
  shared_preferences: ^2.2.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

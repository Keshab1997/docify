name: docify
description: "Docify: Photo , PDF & CV Maker. Resize photo, signature, PDF and CV for job and exam forms."
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  image: ^4.2.0
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  path_provider: ^2.1.4
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^12.0.0
  signature: ^5.5.0
  crop_your_image: ^1.0.2
  google_mobile_ads: ^6.0.0
  shared_preferences: ^2.3.3
  path: ^1.9.0
  package_info_plus: ^9.0.1
  gal: ^2.3.3
  web: ^1.1.1
  url_launcher: ^6.3.1
  # Docify Sync (optional Google Sign-in + user's own Drive backup).
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tools/

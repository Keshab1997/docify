// Google services (Firebase / Google Sign-in for Docify Sync). Classic
// buildscript classpath so the plugin can be applied conditionally below —
// the plugins {} block cannot be conditional, and the repo ships WITHOUT
// google-services.json on purpose: the app is a full guest app until that
// file is dropped in, and a missing file must never break CI builds.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase (Google Sign-in + Drive sync). See the buildscript note above.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing. CI writes android/key.properties (see the reusable
// flutter-build workflow); locally the file is absent and the debug key is
// used instead, so `flutter build apk --release` still works on a dev machine.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// AdMob app id for the manifest placeholder. Debug builds fall back to
// Google's sample app id; release builds must pass the real one:
//   build-env: ADMOB_APP_ID=ca-app-pub-<publisher>~<app>
def admobAppId = System.getenv('ADMOB_APP_ID')
if (admobAppId == null || admobAppId.trim().isEmpty()) {
    admobAppId = 'ca-app-pub-3940256099942544~3347511713'
}

android {
    namespace "com.keshabstudios.docify"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.keshabstudios.docify"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Must merge, never assign. The Flutter Gradle plugin injects its own
        // `applicationName` placeholder into this very map, and Groovy `=`
        // (and `+=`, which goes through Map.plus) replaces the whole map —
        // wiping applicationName and failing the release manifest merge with
        // "requires a placeholder substitution but no value for
        // <applicationName> is provided". put() mutates in place instead.
        manifestPlaceholders.put("admobAppId", admobAppId)
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // The themes in res/values*/styles.xml extend Theme.AppCompat for the
    // My documents lock (see MainActivity), so depend on it directly rather
    // than on whichever plugin happens to pull it in.
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
